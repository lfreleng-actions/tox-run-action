---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  test-basic:
    name: 'Test basic tox-run functionality'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 'Checkout test Python project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: 'lfreleng-actions/test-python-project'
          path: 'test-python-project'

      - name: 'Test multiple environments in parallel'
        uses: $/
        with:
          path_prefix: 'test-python-project'
          # Provision every interpreter the tox-envs below require. The
          # action forwards this to actions/setup-python, which installs
          # each version and places it on PATH so tox can resolve py311
          # and py312. A single version here leaves py311 unresolved on
          # runner images that no longer ship Python 3.11 by default.
          python-version: |
            3.11
            3.12
          tox-envs: 'py311,py312'
          parallel: 'auto'

  test-specific-envs:
    name: 'Test specific environment selection'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 'Checkout test Python project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: 'lfreleng-actions/test-python-project'
          path: 'test-python-project'

      - name: 'Test specific environments'
        uses: $/
        with:
          path_prefix: 'test-python-project'
          python-version: '3.11'
          tox-envs: 'py311'
          parallel: '1'

  test-pre-build-script:
    name: 'Test pre-build script functionality'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 'Checkout test Python project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: 'lfreleng-actions/test-python-project'
          path: 'test-python-project'

      - name: 'Create pre-build script'
        shell: bash
        run: |
          cat > prebuild.sh << 'EOF'
          #!/bin/bash
          echo "Pre-build script executed"
          touch "$GITHUB_WORKSPACE/test-python-project/prebuild-marker"
          EOF
          chmod +x prebuild.sh

      - name: 'Test with pre-build script'
        uses: $/
        with:
          path_prefix: 'test-python-project'
          python-version: '3.11'
          tox-envs: 'py311'
          pre-build-script: './prebuild.sh'

      - name: 'Verify pre-build script ran'
        shell: bash
        run: |
          if [[ ! -f "test-python-project/prebuild-marker" ]]; then
            echo "Pre-build script did not execute properly"
            exit 1
          fi
          echo "Pre-build script verification passed"

  test-pre-build-script-containment:
    name: 'Test pre-build script containment'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs the action's pre-build-script step, extracted from
      # action.yaml, against symlinks that leave the workspace.
      # ubuntu-latest ships mikefarah yq v4, which the test requires.
      - name: 'Run pre-build script containment tests'
        shell: bash
        run: tests/pre-build-script.sh

  test-tox-inputs:
    name: 'Test tox-envs and parallel handling'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs the validation and run steps, extracted from action.yaml,
      # against stubs that record the uv and tox command lines.
      - name: 'Run tox-envs and parallel tests'
        shell: bash
        run: bash tests/tox-step.sh

  check-tox-lock:
    name: 'Check tox lock holds one set of versions'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails a lock with per-Python sections, more than one tox, or a
      # tox below the floor, such as a Dependabot update can produce.
      # ubuntu-latest ships the Python 3.11+ the check needs.
      - name: 'Check tox-lock/uv.lock'
        shell: bash
        run: python3 tests/check-tox-lock.py

      - name: 'Test the check against broken locks'
        shell: bash
        run: bash tests/check-tox-lock-test.sh

  test-error-handling:
    name: 'Test error handling (${{ matrix.case }})'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Each case breaks one input and leaves the others valid, so only
      # the check under test can reject it. Unset inputs default to the
      # test project and no pre-build script.
      matrix:
        include:
          - case: 'missing path_prefix directory'
            path_prefix: 'nonexistent-dir'
            error: 'missing-path-prefix'
          - case: 'path_prefix above the workspace'
            path_prefix: '..'
            error: 'path-prefix-outside-workspace'
          - case: 'path_prefix symlinked out of the workspace'
            path_prefix: 'escape'
            error: 'path-prefix-outside-workspace'
          - case: 'missing tox.ini'
            path_prefix: 'no-tox-ini'
            error: 'missing-tox-ini'
          - case: 'unreadable tox.ini'
            path_prefix: 'unreadable-tox-ini'
            error: 'unreadable-tox-ini'
          - case: 'pre-build script path traversal'
            script: 'test-python-project/../prebuild.sh'
            error: 'script-path-traversal'
          - case: 'pre-build script without .sh suffix'
            script: 'prebuild'
            error: 'script-not-sh'
          - case: 'pre-build script outside the workspace'
            script: 'outside.sh'
            error: 'script-outside-workspace'
          - case: 'missing pre-build script'
            script: 'missing.sh'
            error: 'script-not-found'
          - case: 'pre-build script not executable'
            script: 'noexec.sh'
            error: 'script-not-executable'
          - case: 'tox-envs carrying an option'
            tox_envs: 'py311 --notest'
            error: 'invalid-tox-envs'
          - case: 'parallel carrying an option'
            parallel: '1 --notest'
            error: 'invalid-parallel'
          - case: 'Python older than tox supports'
            python: '3.10'
            error: 'unsupported-python'
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 'Checkout test Python project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: 'lfreleng-actions/test-python-project'
          path: 'test-python-project'

      # Every script passes all checks but the one its case breaks, and
      # fails if run, so one that gets past validation cannot pass.
      - name: 'Create test fixtures'
        shell: bash
        run: |
          # Create test fixtures
          make_script() {
            printf '#!/bin/sh\necho "%s ran past validation"\nexit 1\n' \
              "$1" > "$1"
            chmod +x "$1"
          }
          mkdir no-tox-ini
          # A tox.ini outside the workspace, reached through a symlink
          mkdir "${RUNNER_TEMP}/escape"
          touch "${RUNNER_TEMP}/escape/tox.ini"
          ln -s "${RUNNER_TEMP}/escape" escape
          # The runner user is not root, so mode 000 denies it reading
          mkdir unreadable-tox-ini
          touch unreadable-tox-ini/tox.ini
          chmod 000 unreadable-tox-ini/tox.ini
          make_script prebuild.sh
          make_script prebuild
          make_script "${RUNNER_TEMP}/outside.sh"
          ln -s "${RUNNER_TEMP}/outside.sh" outside.sh
          make_script noexec.sh
          chmod -x noexec.sh

      - name: 'Test ${{ matrix.case }}'
        uses: $/
        id: action
        continue-on-error: true
        with:
          path_prefix: ${{ matrix.path_prefix || 'test-python-project' }}
          python-version: ${{ matrix.python }}
          pre-build-script: ${{ matrix.script }}
          tox-envs: ${{ matrix.tox_envs }}
          parallel: ${{ matrix.parallel || 'auto' }}

      - name: 'Verify the action failed with error=${{ matrix.error }}'
        shell: bash
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR: ${{ steps.action.outputs.error }}
          EXPECTED: ${{ matrix.error }}
        run: |
          # Verify the action failed for the expected reason
          if [[ "$OUTCOME" != 'failure' || "$ERROR" != "$EXPECTED" ]]; then
            echo "::error::Wanted failure with error=$EXPECTED," \
                 "got $OUTCOME with error=$ERROR"
            exit 1
          fi
          echo "✅ Action failed with error=$EXPECTED"

  test-serial:
    name: "Test serial run (parallel: '${{ matrix.parallel }}')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Both values run the environments in turn, without --parallel
      matrix:
        parallel: ['', 'off']
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 'Checkout test Python project'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: 'lfreleng-actions/test-python-project'
          path: 'test-python-project'

      - name: "Test with parallel: '${{ matrix.parallel }}'"
        uses: $/
        with:
          path_prefix: 'test-python-project'
          python-version: '3.11'
          tox-envs: 'py311'
          parallel: ${{ matrix.parallel }}

  test-tox-lock:
    name: 'Test tox lock on Python ${{ matrix.python }}'
    # Pinned, not -latest, so every interpreter in the matrix has a
    # build for the runner image.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # tox-lock/uv.lock holds one tox for Python 3.11 and newer; each
      # of those must install and run it. An older Python must stop the
      # action before it installs anything.
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - python: '3.10'
            error: 'unsupported-python'
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 'Create minimal tox project'
        shell: bash
        run: |
          # Create minimal tox project
          mkdir lock-test
          printf '%s\n' '[tox]' 'env_list = check' 'skipsdist = true' \
            '[testenv:check]' 'skip_install = true' \
            'commands = python -c "print(42)"' > lock-test/tox.ini

      - name: 'Run tox installed from the lock'
        uses: $/
        id: action
        continue-on-error: true
        with:
          path_prefix: 'lock-test'
          python-version: ${{ matrix.python }}
          tox-envs: 'check'

      - name: 'Verify the outcome'
        shell: bash
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR: ${{ steps.action.outputs.error }}
          EXPECTED: ${{ matrix.error }}
        run: |
          # Verify the outcome
          if [[ -z "$EXPECTED" ]]; then
            if [[ "$OUTCOME" != 'success' ]]; then
              echo "::error::Wanted success, got $OUTCOME with error=$ERROR"
              exit 1
            fi
            echo "✅ tox from the lock ran"
          elif [[ "$OUTCOME" != 'failure' || "$ERROR" != "$EXPECTED" ]]; then
            echo "::error::Wanted failure with error=$EXPECTED," \
                 "got $OUTCOME with error=$ERROR"
            exit 1
          else
            echo "✅ Action failed with error=$EXPECTED"
          fi

  test-workspace-isolation:
    name: >-
      Test workspace isolation (${{ matrix.os }}, ${{ matrix.selector }},
      Python ${{ matrix.python || 'the action installs' }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # An earlier step of the caller's job, such as code from the
      # checkout under review, can plant an interpreter and point the
      # job's settings at it. Each selector plants one way to choose
      # it. With no python-version, the action installs its own Python.
      matrix:
        os: ['ubuntu-24.04', 'macos-15']
        selector: ['request', 'active-environment']
        python: ['3.12', '']
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        if: ${{ runner.os == 'Linux' }}
        with:
          egress-policy: audit

      # Beside the bait, not in the workspace root, so the interpreters
      # tox picks for the caller's environment, which are the caller's
      # to choose, do not reach the bait through PYTHONPATH
      - name: 'Create minimal tox project'
        shell: bash
        run: |
          # Create minimal tox project
          mkdir isolation-test
          printf '%s\n' '[tox]' 'env_list = check' 'skipsdist = true' \
            '[testenv:check]' 'skip_install = true' \
            'commands = python -c "print(42)"' > isolation-test/tox.ini

      # As a caller's earlier step would: bait in the workspace, and
      # settings for every later step that point at it. Each bait
      # appends to the marker, and each executable then fails.
      - name: 'Plant bait in the workspace'
        shell: bash
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          # Plant bait in the workspace
          marker="${RUNNER_TEMP}/isolation-marker"
          ws="${GITHUB_WORKSPACE}"
          # bait <path>: an executable at <path> that logs its own path
          bait() {
            printf '#!/bin/sh\necho "%s ran" >> "%s"\nexit 1\n' \
              "$1" "$marker" > "$1"
            chmod +x "$1"
          }
          mkdir -p "$ws/.venv/bin" "$ws/.venv/conda-meta" "$ws/xdg-bin" \
            "$ws/urllib" "$ws/pkg/urllib"
          for name in python python3 python3.13 uv; do
            bait "$ws/.venv/bin/$name"
          done
          for name in env bash; do
            bait "$ws/xdg-bin/$name"
          done
          printf 'home = %s\nversion = 3.13.0\n' "$ws/.venv/bin" \
            > "$ws/.venv/pyvenv.cfg"
          : > "$ws/.venv/conda-meta/history"
          for module in json base64 sitecustomize usercustomize \
              urllib/__init__; do
            for dir in "$ws" "$ws/pkg"; do
              printf 'open(%s, "a").write("%s imported\\n")\n' \
                "'$marker'" "$module" > "$dir/$module.py"
            done
          done

          # GITHUB_PATH, not PATH in GITHUB_ENV: the runner puts the
          # GITHUB_PATH entries ahead of the latter
          echo "$ws/.venv/bin" >> "$GITHUB_PATH"
          arch=$(uname -m)
          if [ "$arch" = 'arm64' ]; then arch='aarch64'; fi
          {
            echo 'PYTHONPATH=pkg:.'
            echo "PYTHONHOME=$ws/.venv"
            echo "PYTHONUSERBASE=$ws/.venv"
            echo "PYTHONSTARTUP=$ws/json.py"
            echo "PYTHONEXECUTABLE=$ws/.venv/bin/python"
            echo "__PYVENV_LAUNCHER__=$ws/.venv/bin/python"
            echo 'UV_NO_CACHE=1'
            echo "UV_PYTHON_ARCH=$arch"
            echo 'UV_PYTHON_INSTALL_MIRROR=https://127.0.0.1:9'
            echo "XDG_BIN_HOME=$ws/xdg-bin"
            if [ "$SELECTOR" = 'request' ]; then
              echo "UV_PYTHON=$ws/.venv/bin/python"
              echo "UV_PYTHON_SEARCH_PATH=$ws/.venv/bin"
              echo "UV_PYTHON_INSTALL_DIR=$ws/.venv/python"
              echo 'UV_PYTHON_PREFERENCE=only-system'
            else
              # UV_PYTHON stays unset, so it cannot mask the discovery
              # of an active environment
              echo "VIRTUAL_ENV=$ws/.venv"
              echo "CONDA_PREFIX=$ws/.venv"
              echo 'CONDA_DEFAULT_ENV=base'
              echo "UV_INTERNAL__PARENT_INTERPRETER=$ws/.venv/bin/python"
              echo 'UV_INTERNAL__TEST_PYTHON_MANAGED=1'
              echo "UV_CACHE_DIR=$ws/.venv/cache"
            fi
          } >> "$GITHUB_ENV"

      # Without live bait its absence proves nothing. Python named by
      # absolute path, started from the workspace without -I, must
      # import it; PYTHONHOME would stop that Python starting at all.
      - name: 'Check the bait is live'
        shell: bash
        run: |
          # Check the bait is live
          marker="${RUNNER_TEMP}/isolation-marker"
          /usr/bin/env -u PYTHONHOME /usr/bin/python3 -c 'import json' ||
            true
          if [ ! -s "$marker" ]; then
            echo "::error::The bait did not run, so the test proves nothing"
            exit 1
          fi
          cat "$marker"
          rm -f "$marker"

      # tox still sees the planted PYTHONHOME and cannot build the
      # caller's environment with it: that, like the interpreters tox
      # picks, is the caller's. Reaching tox shows the action's own
      # steps ran, and the checks below show what they started.
      - name: 'Run the action (cold)'
        id: cold
        uses: $/
        continue-on-error: true
        with:
          path_prefix: 'isolation-test'
          python-version: ${{ matrix.python }}
          tox-envs: 'check'
          parallel: ''

      - name: 'Check the cold run reached tox'
        shell: bash
        run: |
          # Check the cold run reached tox
          if [ ! -d isolation-test/.tox ]; then
            echo "::error::The cold run did not reach tox"
            exit 1
          fi
          rm -rf isolation-test/.tox

      - name: 'Run the action (warm)'
        id: warm
        uses: $/
        continue-on-error: true
        with:
          path_prefix: 'isolation-test'
          python-version: ${{ matrix.python }}
          tox-envs: 'check'
          parallel: ''

      - name: 'Verify no bait ran'
        shell: bash
        env:
          COLD_BACKEND: ${{ steps.cold.outputs.build-backend }}
          COLD_ERROR: ${{ steps.cold.outputs.error }}
          WARM_BACKEND: ${{ steps.warm.outputs.build-backend }}
          WARM_ERROR: ${{ steps.warm.outputs.error }}
        run: |
          # Verify no bait ran
          status=0
          marker="${RUNNER_TEMP}/isolation-marker"
          if [ -e "$marker" ]; then
            echo "::error::Bait ran:"
            cat "$marker"
            status=1
          fi
          case ":${PATH}:" in
            *":${GITHUB_WORKSPACE}/xdg-bin:"*)
              echo "::error::setup-uv put XDG_BIN_HOME on PATH"
              status=1 ;;
          esac
          if [ ! -d isolation-test/.tox ]; then
            echo "::error::The warm run did not reach tox"
            status=1
          fi
          # The test project holds no lock file, and no input is invalid
          if [ "$COLD_BACKEND" != 'none' ] || [ -n "$COLD_ERROR" ]; then
            echo "::error::Cold run outputs: build-backend=$COLD_BACKEND" \
                 "error=$COLD_ERROR"
            status=1
          fi
          if [ "$WARM_BACKEND" != 'none' ] || [ -n "$WARM_ERROR" ]; then
            echo "::error::Warm run outputs: build-backend=$WARM_BACKEND" \
                 "error=$WARM_ERROR"
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            echo "✅ No bait ran, and both runs kept their outputs"
          fi
          exit "$status"
