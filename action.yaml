---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: 'Run TOX'
description: "Run tox with specified Python version and environments"

inputs:
  path_prefix:
    description: 'Directory location containing project code and tox.ini'
    required: false
    default: '.'
  python-version:
    description: 'Version of Python to use'
    required: false
  python-version-file:
    # yamllint disable-line rule:line-length
    description: 'File containing the Python version to use (e.g. pyproject.toml)'
    required: false
  tox-envs:
    # yamllint disable-line rule:line-length
    description: 'Comma-separated tox envs to run on this py-version; no spaces or options'
    required: false
  parallel:
    # yamllint disable-line rule:line-length
    description: 'Parallel processes: auto, all, a number, or off/empty to run envs in turn'
    required: false
    default: 'auto'
  pre-build-script:
    # yamllint disable-line rule:line-length
    description: 'Path to optional pre-build repository shell script; path traversal blocked'
    required: false

outputs:
  build-backend:
    description: "The detected Python dependency management tool"
    # Supported: uv, pdm, poetry, pipenv, pip-tools, pip, or none
    value: ${{ steps.detect-deps.outputs.build-backend }}
  error:
    description: 'Reason input validation stopped the action, or empty'
    # Composite outputs are evaluated after a failed step too
    value: ${{ steps.validate.outputs.error || steps.pre-build.outputs.error }}

runs:
  using: 'composite'
  steps:
    - name: 'Validate action/environment'
      id: validate
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_TOX_ENVS: ${{ inputs.tox-envs }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
      run: |
        # Validate action/environment
        # fail <reason>: stop, publishing <reason> as the error output
        fail() {
          echo "error=$1" >> "$GITHUB_OUTPUT"
          exit 1
        }

        TOX_DIR="${GITHUB_WORKSPACE}/${INPUT_PATH_PREFIX}"
        echo "🔍 Validating tox directory: $TOX_DIR"

        if [[ ! -d "$TOX_DIR" ]]; then
          echo "Error: specified path_prefix '${INPUT_PATH_PREFIX}'" \
               "does not exist ❌"
          echo "Current working directory: $(pwd)"
          echo "Available directories:"
          ls -la "${GITHUB_WORKSPACE}" || echo "Cannot list workspace contents"
          fail missing-path-prefix
        fi

        # Check for tox.ini file existence and readability
        if [[ ! -f "$TOX_DIR/tox.ini" ]]; then
          echo "❌ Error: tox.ini not found in '${INPUT_PATH_PREFIX}'"
          fail missing-tox-ini
        fi
        if [[ ! -r "$TOX_DIR/tox.ini" ]]; then
          echo "❌ Error: '$TOX_DIR/tox.ini' exists but is not readable"
          fail unreadable-tox-ini
        fi

        echo "✅ path_prefix '${INPUT_PATH_PREFIX}'" \
             "is valid and contains tox.ini"

        # Both inputs reach the tox command line. Anything beyond names
        # and counts could carry an option such as --notest, which skips
        # every command and still reports success.
        env_name='[A-Za-z0-9_][A-Za-z0-9_.+-]*'
        if [[ -n "$INPUT_TOX_ENVS" ]] && \
           ! [[ "$INPUT_TOX_ENVS" =~ ^${env_name}(,${env_name})*$ ]]; then
          echo "❌ Error: tox-envs must be env names separated by commas," \
               "with no spaces or options: '${INPUT_TOX_ENVS}'"
          fail invalid-tox-envs
        fi
        if [[ -n "$INPUT_PARALLEL" ]] && \
           ! [[ "$INPUT_PARALLEL" =~ ^(auto|all|off|[0-9]+)$ ]]; then
          echo "❌ Error: parallel must be auto, all, off or a number:" \
               "'${INPUT_PARALLEL}'"
          fail invalid-parallel
        fi

    - name: 'Setup Python'
      id: setup-python
      # yamllint disable-line rule:line-length
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        python-version-file: ${{ inputs.python-version-file }}

    - name: 'Run pre-build-script'
      id: pre-build
      if: ${{ inputs.pre-build-script != '' }}
      shell: bash
      env:
        INPUT_PRE_BUILD_SCRIPT: ${{ inputs.pre-build-script }}
      run: |
        # Run pre-build-script
        # fail <reason>: stop, publishing <reason> as the error output
        fail() {
          echo "error=$1" >> "$GITHUB_OUTPUT"
          exit 1
        }

        SCRIPT_PATH="${INPUT_PRE_BUILD_SCRIPT}"

        echo "🔍 Validating pre-build script: $SCRIPT_PATH"

        # Security: Prevent path traversal
        if [[ "$SCRIPT_PATH" == *".."* ]]; then
          echo "❌ Error: Path traversal detected in script path"
          fail script-path-traversal
        fi

        # Security: Only run shell scripts with .sh filename suffix
        if [[ "$SCRIPT_PATH" != *.sh ]]; then
          echo "❌ Error: Only .sh scripts are allowed"
          echo "Provided: $SCRIPT_PATH"
          fail script-not-sh
        fi

        # Security: Restrict to repository-owned scripts. Resolve the
        # workspace the same way as the script below, so a workspace
        # reached through a symlink still contains its own scripts.
        REPO_ROOT=$(readlink -f "${GITHUB_WORKSPACE}" 2>/dev/null || \
                    realpath "${GITHUB_WORKSPACE}" 2>/dev/null) || true

        if [[ -z "$REPO_ROOT" ]]; then
          echo "❌ Error: Failed to resolve canonical path for workspace"
          echo "This system may not support readlink or realpath commands"
          fail workspace-unresolved
        fi
        FULL_PATH="$REPO_ROOT/$SCRIPT_PATH"

        # Validate path is within repository (prevent symlink attacks)
        CANONICAL_PATH=$(readlink -f "$FULL_PATH" 2>/dev/null || \
                         realpath "$FULL_PATH" 2>/dev/null) || true

        if [[ -z "$CANONICAL_PATH" ]]; then
          echo "❌ Error: Failed to resolve canonical path for script"
          echo "This system may not support readlink or realpath commands"
          fail script-unresolved
        fi

        # The separator stops a sibling such as "$REPO_ROOT-other" from
        # passing as a prefix match
        if [[ "$CANONICAL_PATH" != "$REPO_ROOT"/* ]]; then
          echo "❌ Error: Script must be within repository"
          fail script-outside-workspace
        fi
        if [[ ! -f "$CANONICAL_PATH" ]]; then
          echo "❌ Error: Script not found at: $SCRIPT_PATH"
          fail script-not-found
        fi
        # For security reasons, we require the script to be marked executable
        if [[ ! -x "$CANONICAL_PATH" ]]; then
          echo "❌ Error: Script not marked executable at: $SCRIPT_PATH"
          fail script-not-executable
        fi
        echo "✅ Script validation passed"

        # Run the script. Only validation may set this step's outputs,
        # so a script cannot report a validation error.
        GITHUB_OUTPUT=/dev/null "$CANONICAL_PATH"

    - name: 'Detect dependency management tool'
      id: detect-deps
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
      run: |
        # Detect dependency management tool
        cd "${GITHUB_WORKSPACE}/${INPUT_PATH_PREFIX}" || exit 1

        echo "🔍 Detecting Python dependency management tool"
        # Priority order for detection and installation
        DETECTED_BACKEND=""

        if [[ -f "uv.lock" ]]; then
          echo "✅ Detected uv with uv.lock"
          DETECTED_BACKEND="uv"
        elif [[ -f "pdm.lock" ]]; then
          echo "✅ Detected PDM with pdm.lock"
          DETECTED_BACKEND="pdm"
        elif [[ -f "poetry.lock" ]]; then
          echo "✅ Detected Poetry with poetry.lock"
          DETECTED_BACKEND="poetry"
        elif [[ -f "Pipfile.lock" ]]; then
          echo "✅ Detected Pipenv with Pipfile.lock"
          DETECTED_BACKEND="pipenv"
        elif [[ -f "requirements.txt" ]] && \
             (grep -q "==" requirements.txt 2>/dev/null || \
              [[ -f "requirements.in" ]]); then
          echo "✅ Detected pip-tools with requirements.txt"
          DETECTED_BACKEND="pip-tools"
        elif [[ -f "requirements.txt" ]]; then
          echo "⚠️ Detected plain pip with requirements.txt"
          DETECTED_BACKEND="pip"
        elif [[ -f "pyproject.toml" ]]; then
          echo "⚠️ Detected pyproject.toml without lock file"
          DETECTED_BACKEND="pip"
        else
          echo "ℹ️ No dependency files found"
          DETECTED_BACKEND="none"
        fi

        echo "Note: tox manages dependencies in isolated environments"
        echo "build-backend=$DETECTED_BACKEND" >> "$GITHUB_OUTPUT"
        # Add to GitHub Step Summary
        {
          echo "## 🔧 Build Backend Detection"
          echo ""
          echo "**Detected Tool:** \`$DETECTED_BACKEND\`"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 'Run tox'
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_TOX_ENVS: ${{ inputs.tox-envs }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        # yamllint disable-line rule:line-length
        STEPS_SETUP_PYTHON_OUTPUTS_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      run: |
        # Run tox
        path_prefix="${INPUT_PATH_PREFIX}"
        tox_envs="${INPUT_TOX_ENVS}"
        parallel="${INPUT_PARALLEL}"

        cd "${GITHUB_WORKSPACE}/$path_prefix" || exit 1

        # Python distutils module was deprecated in Python 3.10 and
        # removed in 3.12.

        # Get the actual Python version that was installed
        INSTALLED_VERSION=$(python --version 2>&1 | cut -d' ' -f2)
        MIN_PYTHON_VERSION='3.12'

        # Extract major.minor versions (e.g., 3.12.3 -> major=3, minor=12)
        INP_MAJOR=$(echo "$INSTALLED_VERSION" | cut -d'.' -f1)
        INP_MINOR=$(echo "$INSTALLED_VERSION" | cut -d'.' -f2)
        MIN_MAJOR=$(echo "$MIN_PYTHON_VERSION" | cut -d'.' -f1)
        MIN_MINOR=$(echo "$MIN_PYTHON_VERSION" | cut -d'.' -f2)

        # Validate that version components are numeric
        if ! [[ "$INP_MAJOR" =~ ^[0-9]+$ ]] || \
           ! [[ "$INP_MINOR" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: Unable to parse Python version: '$INSTALLED_VERSION'"
            echo "Expected format: X.Y.Z (e.g., 3.12.1)"
            exit 1
        fi

        if (( INP_MAJOR > MIN_MAJOR )) || \
           { (( INP_MAJOR == MIN_MAJOR )) && \
             (( INP_MINOR >= MIN_MINOR )); }; then
            # For Python 3.12+, upgrade pip and setuptools to ensure
            # compatibility
            # with packaging tools that no longer rely on distutils.
            pip install --upgrade pip setuptools
        fi

        # Install tox from the hashed lock, on the Python set up above,
        # into a virtual environment of its own. A bare install would
        # take whatever tox PyPI served on the day. -I keeps the project
        # directory, and PYTHONPATH, off sys.path, so a local venv.py or
        # pip.py cannot stand in for the real module.
        tox_venv=$(mktemp -d "${RUNNER_TEMP}/tox-venv.XXXXXX")
        "${STEPS_SETUP_PYTHON_OUTPUTS_PYTHON_PATH}" -I -m venv "$tox_venv"
        tox_bin="$tox_venv/bin"
        if [[ ! -d "$tox_bin" ]]; then
            # Windows lays a virtual environment out differently
            tox_bin="$tox_venv/Scripts"
        fi
        "$tox_bin/python" -I -m pip install --quiet \
          --disable-pip-version-check --require-hashes --only-binary=:all: \
          -r "${GITHUB_ACTION_PATH}/requirements/tox.txt"

        tox_args=()
        # 'off', like an empty value, runs the environments in turn
        if [[ -n "$parallel" && "$parallel" != 'off' ]]; then
            tox_args+=(--parallel "$parallel" --parallel-live)
        fi
        if [[ -n "$tox_envs" ]]; then
            tox_args+=(-e "$tox_envs")
        fi

        "$tox_bin/tox" "${tox_args[@]}"
