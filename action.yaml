---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: 'Run TOX'
description: "Run tox with specified Python version and environments"

inputs:
  path_prefix:
    # yamllint disable-line rule:line-length
    description: 'Directory containing tox.ini, relative to and inside the workspace'
    required: false
    default: '.'
  python-version:
    description: 'Version of Python to use'
    required: false
  python-version-file:
    # yamllint disable-line rule:line-length
    description: 'File holding the Python version, relative to the workspace root (e.g. pyproject.toml)'
    required: false
  tox-envs:
    # yamllint disable-line rule:line-length
    description: 'Comma-separated tox envs to run on this py-version; no spaces or options'
    required: false
  parallel:
    # yamllint disable-line rule:line-length
    description: 'Parallel processes: auto, all, a number, or off/empty to run envs in turn'
    required: false
    default: 'auto'
  pre-build-script:
    # yamllint disable-line rule:line-length
    description: 'Executable .sh script, relative to and inside the workspace, run before tox'
    required: false

outputs:
  build-backend:
    description: "The detected Python dependency management tool"
    # Supported: uv, pdm, poetry, pipenv, pip-tools, pip, or none
    value: ${{ steps.detect-deps.outputs.build-backend }}
  error:
    description: 'Reason input validation stopped the action, or empty'
    # Composite outputs are evaluated after a failed step too
    # yamllint disable-line rule:line-length
    value: ${{ steps.validate.outputs.error || steps.check-python.outputs.error || steps.pre-build.outputs.error }}

runs:
  using: 'composite'
  steps:
    - name: 'Validate action/environment'
      id: validate
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_TOX_ENVS: ${{ inputs.tox-envs }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
      run: |
        # Validate action/environment
        # fail <reason>: stop, publishing <reason> as the error output
        fail() {
          echo "error=$1" >> "$GITHUB_OUTPUT"
          exit 1
        }

        TOX_DIR="${GITHUB_WORKSPACE}/${INPUT_PATH_PREFIX}"
        echo "🔍 Validating tox directory: $TOX_DIR"

        if [[ ! -d "$TOX_DIR" ]]; then
          echo "Error: specified path_prefix '${INPUT_PATH_PREFIX}'" \
               "does not exist ❌"
          echo "Current working directory: $(pwd)"
          echo "Available directories:"
          ls -la "${GITHUB_WORKSPACE}" || echo "Cannot list workspace contents"
          fail missing-path-prefix
        fi

        # Keep tox inside the checkout: resolve both paths through any
        # symlinks, then require the directory to be the workspace or
        # below it. '..' or a symlink would otherwise run a tox.ini
        # from elsewhere on the runner.
        resolve() {
          readlink -f "$1" 2>/dev/null || realpath "$1" 2>/dev/null
        }
        WORKSPACE_DIR=$(resolve "${GITHUB_WORKSPACE}") || true
        if [[ -z "$WORKSPACE_DIR" ]]; then
          echo "❌ Error: Failed to resolve canonical path for workspace"
          fail workspace-unresolved
        fi
        CANONICAL_TOX_DIR=$(resolve "$TOX_DIR") || true
        if [[ -z "$CANONICAL_TOX_DIR" ]]; then
          echo "❌ Error: Failed to resolve canonical path for" \
               "path_prefix '${INPUT_PATH_PREFIX}'"
          fail path-prefix-unresolved
        fi
        if [[ "$CANONICAL_TOX_DIR" != "$WORKSPACE_DIR" && \
              "$CANONICAL_TOX_DIR" != "$WORKSPACE_DIR"/* ]]; then
          echo "❌ Error: path_prefix '${INPUT_PATH_PREFIX}' resolves to" \
               "'$CANONICAL_TOX_DIR', outside the workspace"
          fail path-prefix-outside-workspace
        fi

        # Check for tox.ini file existence and readability
        if [[ ! -f "$TOX_DIR/tox.ini" ]]; then
          echo "❌ Error: tox.ini not found in '${INPUT_PATH_PREFIX}'"
          fail missing-tox-ini
        fi
        if [[ ! -r "$TOX_DIR/tox.ini" ]]; then
          echo "❌ Error: '$TOX_DIR/tox.ini' exists but is not readable"
          fail unreadable-tox-ini
        fi

        echo "✅ path_prefix '${INPUT_PATH_PREFIX}'" \
             "is valid and contains tox.ini"

        # Both inputs reach the tox command line. Anything beyond names
        # and counts could carry an option such as --notest, which skips
        # every command and still reports success.
        env_name='[A-Za-z0-9_][A-Za-z0-9_.+-]*'
        if [[ -n "$INPUT_TOX_ENVS" ]] && \
           ! [[ "$INPUT_TOX_ENVS" =~ ^${env_name}(,${env_name})*$ ]]; then
          echo "❌ Error: tox-envs must be env names separated by commas," \
               "with no spaces or options: '${INPUT_TOX_ENVS}'"
          fail invalid-tox-envs
        fi
        if [[ -n "$INPUT_PARALLEL" ]] && \
           ! [[ "$INPUT_PARALLEL" =~ ^(auto|all|off|[0-9]+)$ ]]; then
          echo "❌ Error: parallel must be auto, all, off or a number:" \
               "'${INPUT_PARALLEL}'"
          fail invalid-parallel
        fi

    - name: 'Setup Python'
      id: setup-python
      # yamllint disable-line rule:line-length
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        python-version-file: ${{ inputs.python-version-file }}

    # tox needs Python 3.11 or newer, so the interpreter that will run
    # it must be one. setup-python sets python-path once per version it
    # installs, so when python-version lists several, the last one runs
    # tox. Older interpreters on PATH still serve tox environments.
    - name: 'Check Python version'
      id: check-python
      shell: bash
      env:
        # yamllint disable-line rule:line-length
        STEPS_SETUP_PYTHON_OUTPUTS_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
      run: |
        # Check Python version
        # fail <reason>: stop, publishing <reason> as the error output
        fail() {
          echo "error=$1" >> "$GITHUB_OUTPUT"
          exit 1
        }

        # The floor tox-lock/pyproject.toml sets as requires-python;
        # raise the two together
        min_major=3
        min_minor=11
        floor="${min_major}.${min_minor}"

        python="${STEPS_SETUP_PYTHON_OUTPUTS_PYTHON_PATH}"
        if [[ -z "$python" ]]; then
          # With no version to set up, setup-python leaves the runner's
          # Python in place, and 'Install Python' provides tox's own
          echo "ℹ️ No Python set up; the action installs its own for tox"
          exit 0
        fi

        # -I ignores PYTHON* variables and the working directory; macOS
        # reads these two even then
        unset PYTHONEXECUTABLE __PYVENV_LAUNCHER__
        version=$("$python" -I -c \
          'import sys; print("%d.%d" % sys.version_info[:2])' \
          2> /dev/null) || true
        # Python on Windows ends the line with CRLF, and command
        # substitution strips only the newline
        version="${version%$'\r'}"
        if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
          echo "❌ Error: Cannot read the version of Python at '$python'"
          fail unsupported-python
        fi
        major="${BASH_REMATCH[1]}"
        minor="${BASH_REMATCH[2]}"
        if (( 10#$major < min_major ||
              (10#$major == min_major && 10#$minor < min_minor) )); then
          echo "❌ Error: tox needs Python $floor or newer to run, and" \
               "setup-python provided Python $version"
          echo "Set python-version to $floor or newer. When it lists" \
               "several versions, the last one runs tox: list the newest last"
          fail unsupported-python
        fi
        echo "✅ Python $version can run tox"

    # 'Run tox' uses uv to install tox from the action's own lock.
    # setup-uv's only uv call for these inputs is "uv python find",
    # whose result it executes. An invalid preference makes uv refuse
    # its arguments before any lookup; setup-uv then reports the
    # Python version as "unknown", which nothing reads.
    # setup-uv puts tool-bin-dir on PATH, so it is the action's own
    # directory, not one the caller's HOME, XDG_* or UV_TOOL_BIN_DIR
    # names. On Windows setup-uv replaces UV_TOOL_DIR and
    # UV_TOOL_BIN_DIR for the rest of the job unless given them, so
    # there it keeps any the caller sets.
    - name: 'Install uv'
      id: setup-uv
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: '0.13.4'
        working-directory: ${{ github.action_path }}
        # The post-step "uv cache prune" would hit the invalid
        # preference; no cache either way, as this runs in other
        # repositories' jobs
        enable-cache: false
        tool-dir: ${{ runner.os == 'Windows' && env.UV_TOOL_DIR || '' }}
        # yamllint disable-line rule:line-length
        tool-bin-dir: ${{ runner.os == 'Windows' && env.UV_TOOL_BIN_DIR || format('{0}/tox-run-action/bin', runner.temp) }}
      env:
        UV_NO_CONFIG: '1'
        UV_NO_PROJECT: '1'
        UV_PYTHON_PREFERENCE: 'lookup-disabled'
        # Inherited, it makes setup-uv probe uv, which the line above fails
        UV_PYTHON_ARCH: ''
        UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/tox-run-action/python

    # Without a Python from setup-python, tox needs a trusted one: uv
    # installs its own pinned, hash-checked build. uv runs with an
    # empty environment plus an allow-list, so no caller variable can
    # pick or redirect the interpreter.
    - name: 'Install Python'
      id: python
      if: ${{ steps.setup-python.outputs.python-path == '' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        UV: ${{ steps.setup-uv.outputs.uv-path }}
        INSTALL_DIR: ${{ runner.temp }}/tox-run-action/python
        CACHE_DIR: ${{ runner.temp }}/tox-run-action/cache
        PYTHON_VERSION: '3.13'
      run: |
        # Install Python
        clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
          "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR" "UV_CACHE_DIR=$CACHE_DIR")
        # SYSTEMROOT lets uv reach the network on Windows
        for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
            https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
            UV_NATIVE_TLS SYSTEMROOT; do
          if [ -n "${!name+set}" ]; then clean+=("$name=${!name}"); fi
        done
        /usr/bin/env -i "${clean[@]}" "$UV" python install --quiet \
          --no-bin "$PYTHON_VERSION"
        PYTHON=$(/usr/bin/env -i "${clean[@]}" "$UV" python find \
          --managed-python "$PYTHON_VERSION")
        # Windows mixes separators: compare with forward slashes only
        case "${PYTHON//\\//}" in
          "${INSTALL_DIR//\\//}"/*) ;;
          *) echo "Error: uv found Python outside its install directory ❌"
             exit 1 ;;
        esac
        echo "✅ Python $PYTHON_VERSION installed for tox"
        echo "path=$PYTHON" >> "$GITHUB_OUTPUT"

    - name: 'Run pre-build-script'
      id: pre-build
      if: ${{ inputs.pre-build-script != '' }}
      shell: bash
      env:
        INPUT_PRE_BUILD_SCRIPT: ${{ inputs.pre-build-script }}
      run: |
        # Run pre-build-script
        # fail <reason>: stop, publishing <reason> as the error output
        fail() {
          echo "error=$1" >> "$GITHUB_OUTPUT"
          exit 1
        }

        SCRIPT_PATH="${INPUT_PRE_BUILD_SCRIPT}"

        echo "🔍 Validating pre-build script: $SCRIPT_PATH"

        # Security: Prevent path traversal
        if [[ "$SCRIPT_PATH" == *".."* ]]; then
          echo "❌ Error: Path traversal detected in script path"
          fail script-path-traversal
        fi

        # Security: Only run shell scripts with .sh filename suffix
        if [[ "$SCRIPT_PATH" != *.sh ]]; then
          echo "❌ Error: Only .sh scripts are allowed"
          echo "Provided: $SCRIPT_PATH"
          fail script-not-sh
        fi

        # Security: Restrict to repository-owned scripts. Resolve the
        # workspace the same way as the script below, so a workspace
        # reached through a symlink still contains its own scripts.
        REPO_ROOT=$(readlink -f "${GITHUB_WORKSPACE}" 2>/dev/null || \
                    realpath "${GITHUB_WORKSPACE}" 2>/dev/null) || true

        if [[ -z "$REPO_ROOT" ]]; then
          echo "❌ Error: Failed to resolve canonical path for workspace"
          echo "This system may not support readlink or realpath commands"
          fail workspace-unresolved
        fi
        FULL_PATH="$REPO_ROOT/$SCRIPT_PATH"

        # Validate path is within repository (prevent symlink attacks)
        CANONICAL_PATH=$(readlink -f "$FULL_PATH" 2>/dev/null || \
                         realpath "$FULL_PATH" 2>/dev/null) || true

        if [[ -z "$CANONICAL_PATH" ]]; then
          echo "❌ Error: Failed to resolve canonical path for script"
          echo "This system may not support readlink or realpath commands"
          fail script-unresolved
        fi

        # The separator stops a sibling such as "$REPO_ROOT-other" from
        # passing as a prefix match
        if [[ "$CANONICAL_PATH" != "$REPO_ROOT"/* ]]; then
          echo "❌ Error: Script must be within repository"
          fail script-outside-workspace
        fi
        if [[ ! -f "$CANONICAL_PATH" ]]; then
          echo "❌ Error: Script not found at: $SCRIPT_PATH"
          fail script-not-found
        fi
        # For security reasons, we require the script to be marked executable
        if [[ ! -x "$CANONICAL_PATH" ]]; then
          echo "❌ Error: Script not marked executable at: $SCRIPT_PATH"
          fail script-not-executable
        fi
        echo "✅ Script validation passed"

        # Run the script. Only validation may set this step's outputs,
        # so a script cannot report a validation error.
        GITHUB_OUTPUT=/dev/null "$CANONICAL_PATH"

    - name: 'Detect dependency management tool'
      id: detect-deps
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
      run: |
        # Detect dependency management tool
        # -P resolves '..' after symlinks, as validation did; a logical
        # cd could land outside the directory validation approved
        cd -P -- "${GITHUB_WORKSPACE}/${INPUT_PATH_PREFIX}" || exit 1

        echo "🔍 Detecting Python dependency management tool"
        # Priority order for detection and installation
        DETECTED_BACKEND=""

        if [[ -f "uv.lock" ]]; then
          echo "✅ Detected uv with uv.lock"
          DETECTED_BACKEND="uv"
        elif [[ -f "pdm.lock" ]]; then
          echo "✅ Detected PDM with pdm.lock"
          DETECTED_BACKEND="pdm"
        elif [[ -f "poetry.lock" ]]; then
          echo "✅ Detected Poetry with poetry.lock"
          DETECTED_BACKEND="poetry"
        elif [[ -f "Pipfile.lock" ]]; then
          echo "✅ Detected Pipenv with Pipfile.lock"
          DETECTED_BACKEND="pipenv"
        elif [[ -f "requirements.txt" ]] && \
             (grep -q "==" requirements.txt 2>/dev/null || \
              [[ -f "requirements.in" ]]); then
          echo "✅ Detected pip-tools with requirements.txt"
          DETECTED_BACKEND="pip-tools"
        elif [[ -f "requirements.txt" ]]; then
          echo "⚠️ Detected plain pip with requirements.txt"
          DETECTED_BACKEND="pip"
        elif [[ -f "pyproject.toml" ]]; then
          echo "⚠️ Detected pyproject.toml without lock file"
          DETECTED_BACKEND="pip"
        else
          echo "ℹ️ No dependency files found"
          DETECTED_BACKEND="none"
        fi

        echo "Note: tox manages dependencies in isolated environments"
        echo "build-backend=$DETECTED_BACKEND" >> "$GITHUB_OUTPUT"
        # Add to GitHub Step Summary
        {
          echo "## 🔧 Build Backend Detection"
          echo ""
          echo "**Detected Tool:** \`$DETECTED_BACKEND\`"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 'Run tox'
      shell: bash
      env:
        INPUT_PATH_PREFIX: ${{ inputs.path_prefix }}
        INPUT_TOX_ENVS: ${{ inputs.tox-envs }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        # yamllint disable-line rule:line-length
        PYTHON: ${{ steps.setup-python.outputs.python-path || steps.python.outputs.path }}
        STEPS_SETUP_UV_OUTPUTS_UV_PATH: ${{ steps.setup-uv.outputs.uv-path }}
      run: |
        # Run tox
        path_prefix="${INPUT_PATH_PREFIX}"
        tox_envs="${INPUT_TOX_ENVS}"
        parallel="${INPUT_PARALLEL}"

        if [[ -z "$PYTHON" ]]; then
          echo "❌ Error: No Python to run tox"
          exit 1
        fi

        # -P resolves '..' after symlinks, as validation did; a logical
        # cd could land outside the directory validation approved
        cd -P -- "${GITHUB_WORKSPACE}/$path_prefix" || exit 1

        # Install tox from the action's uv lock, on the Python chosen
        # above by absolute path, into a virtual environment of its own.
        # A bare install would take whatever tox PyPI served on the day.
        # This runs in the caller's project, so nothing of the caller's
        # may steer it: --no-config skips any uv.toml or [tool.uv] found
        # here, and every UV_* variable goes, so none can redirect the
        # index, the project or the environment. The subshell confines
        # that to the install: tox and its commands still see the
        # caller's UV_*.
        tox_venv=$(mktemp -d "${RUNNER_TEMP}/tox-venv.XXXXXX")
        (
            while IFS= read -r name; do
                unset "$name"
            done < <(compgen -e | grep '^UV_' || true)
            UV_PROJECT_ENVIRONMENT="$tox_venv" \
              "${STEPS_SETUP_UV_OUTPUTS_UV_PATH}" \
              sync --quiet --frozen --no-config --no-install-project \
              --no-build --project "${GITHUB_ACTION_PATH}/tox-lock" \
              --python "$PYTHON"
        )
        tox_bin="$tox_venv/bin"
        if [[ ! -d "$tox_bin" ]]; then
            # Windows lays a virtual environment out differently
            tox_bin="$tox_venv/Scripts"
        fi

        tox_args=()
        # 'off', like an empty value, runs the environments in turn
        if [[ -n "$parallel" && "$parallel" != 'off' ]]; then
            tox_args+=(--parallel "$parallel" --parallel-live)
        fi
        if [[ -n "$tox_envs" ]]; then
            tox_args+=(-e "$tox_envs")
        fi

        # tox starts from its environment's own Python with -I, so no
        # PYTHON* variable or module in this directory reaches it; macOS
        # reads these two even under -I. tox and its commands still see
        # the caller's other variables.
        unset PYTHONEXECUTABLE __PYVENV_LAUNCHER__
        "$tox_bin/python" -I -m tox "${tox_args[@]}"
