# The tox the action installs, locked in uv.lock beside this file. See
# README.md here for how the lock is maintained and refreshed.
[project]
name = "tox-run-action-tox"
version = "0"
# The oldest Python every locked package supports, so the lock holds a
# single set of versions. The 'Check Python version' step in action.yaml
# holds the same floor: raise the two together. The lower bound on tox
# makes an update that drops a supported Python fail to resolve, rather
# than fall back to an ancient tox.
requires-python = ">=3.11"
dependencies = ["tox>=4.67.4"]

[tool.uv]
package = false
